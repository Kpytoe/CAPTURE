# Publica CapturaLocal.exe en la página de Releases de GitHub al subir una etiqueta vX.Y.Z.
#
#   git tag v0.0.2
#   git push origin v0.0.2
#
# Ver ADR-007 en docs/DECISIONS.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necesario para crear la Release y subir el .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pruebas
        run: dotnet test tests\CapturaLocal.Tests

      - name: Privacidad (RNF-03) — sin código de red ni paquetes en src
        shell: pwsh
        run: |
          $red = git grep -nE 'HttpClient|WebClient|WebRequest|Socket|telemetr' -- src
          $pkg = git grep -n '<PackageReference' -- src
          if ($red -or $pkg) { $red; $pkg; throw "src\ tiene código de red o dependencias" }
          exit 0   # git grep sin coincidencias sale con 1; aquí eso es el caso bueno

      - name: Publicar .exe portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src\CapturaLocal\CapturaLocal.csproj -p:PublishProfile=Portable -p:Version=$version
          Copy-Item artifacts\portable\CapturaLocal.exe "CapturaLocal-$version-win-x64.exe"
          (Get-FileHash "CapturaLocal-$version-win-x64.exe" -Algorithm SHA256).Hash.ToLower() + "  CapturaLocal-$version-win-x64.exe" |
            Out-File -Encoding ascii "CapturaLocal-$version-win-x64.exe.sha256"

      - name: Crear Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" `
            "CapturaLocal-$version-win-x64.exe" "CapturaLocal-$version-win-x64.exe.sha256" `
            --title "Captura Local $version" --generate-notes
