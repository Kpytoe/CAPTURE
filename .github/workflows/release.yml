# Publica CapturaLocal.exe en la página de Releases de GitHub al subir una etiqueta vX.Y.Z.
#
#   git tag v0.0.2
#   git push origin v0.0.2
#
# Ver ADR-007 en docs/DECISIONS.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necesario para crear la Release y subir el .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pruebas
        run: dotnet test tests\CapturaLocal.Tests

      - name: Privacidad (RNF-03) — sin código de red ni paquetes en src
        shell: pwsh
        run: |
          $red = git grep -nE 'HttpClient|WebClient|WebRequest|Socket|telemetr' -- src
          $pkg = git grep -n '<PackageReference' -- src
          if ($red -or $pkg) { $red; $pkg; throw "src\ tiene código de red o dependencias" }
          exit 0   # git grep sin coincidencias sale con 1; aquí eso es el caso bueno

      - name: Publicar .exe portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src\CapturaLocal\CapturaLocal.csproj -p:PublishProfile=Portable -p:Version=$version
          # El .zip es la descarga recomendada: los navegadores bloquean a menudo un .exe sin firmar.
          # Nombre sin versión para que el enlace releases/latest/download/... no cambie nunca.
          Compress-Archive -Path artifacts\portable\CapturaLocal.exe -DestinationPath CapturaLocal-win-x64.zip
          Copy-Item artifacts\portable\CapturaLocal.exe "CapturaLocal-$version-win-x64.exe"
          Get-FileHash CapturaLocal-win-x64.zip, "CapturaLocal-$version-win-x64.exe" -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt

      - name: Crear o actualizar la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $archivos = "CapturaLocal-win-x64.zip", "CapturaLocal-$version-win-x64.exe", "SHA256SUMS.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archivos --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # La v0.0.1 original publicó el hash en un archivo aparte; al re-subir el .exe queda obsoleto.
            gh release delete-asset $tag "CapturaLocal-$version-win-x64.exe.sha256" --yes *> $null
            exit 0
          } else {
            gh release create $tag $archivos --title "Captura Local $version" --generate-notes
          }
          exit $LASTEXITCODE
